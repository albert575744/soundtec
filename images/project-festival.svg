<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="festGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#festGrad)"/>

  <!-- Stage -->
  <path d="M100 350 L700 350 L650 400 L150 400 Z" fill="white" opacity="0.2"/>

  <!-- Line array speakers -->
  <rect x="120" y="150" width="30" height="200" rx="5" fill="white" opacity="0.3"/>
  <rect x="160" y="150" width="30" height="200" rx="5" fill="white" opacity="0.3"/>

  <rect x="610" y="150" width="30" height="200" rx="5" fill="white" opacity="0.3"/>
  <rect x="650" y="150" width="30" height="200" rx="5" fill="white" opacity="0.3"/>

  <!-- Center speaker stack -->
  <rect x="350" y="280" width="100" height="80" rx="8" fill="white" opacity="0.25"/>
  <rect x="360" y="240" width="80" height="40" rx="5" fill="white" opacity="0.25"/>

  <!-- Stage lights -->
  <circle cx="250" cy="100" r="15" fill="#FFD700" opacity="0.6"/>
  <circle cx="400" cy="80" r="15" fill="#FFD700" opacity="0.6"/>
  <circle cx="550" cy="100" r="15" fill="#FFD700" opacity="0.6"/>

  <!-- Light beams -->
  <path d="M250 115 L220 350" stroke="white" stroke-width="30" opacity="0.1"/>
  <path d="M400 95 L400 350" stroke="white" stroke-width="30" opacity="0.1"/>
  <path d="M550 115 L580 350" stroke="white" stroke-width="30" opacity="0.1"/>

  <!-- Text -->
  <text x="400" y="450" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle" opacity="0.9">FESTIVAL</text>
</svg>
