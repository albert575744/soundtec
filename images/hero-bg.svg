<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.03" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.03" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#grad1)"/>

  <!-- Abstract sound waves -->
  <path d="M0 540 Q480 400, 960 540 T1920 540" stroke="url(#grad2)" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M0 520 Q480 420, 960 520 T1920 520" stroke="url(#grad2)" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M0 560 Q480 380, 960 560 T1920 560" stroke="url(#grad2)" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- Circles -->
  <circle cx="1600" cy="200" r="150" fill="url(#grad2)" opacity="0.1"/>
  <circle cx="300" cy="800" r="200" fill="url(#grad2)" opacity="0.1"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1" fill="#6366f1" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>
</svg>
